<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background: #f8f9fa; color: #333; margin: 0; text-align: center;
    }
    h1 { margin-bottom: 8px; color: #dc3545; }
    p { margin: 4px 0; }
    small { color: #6c757d; margin-top: 14px; }
    button {
      padding: 10px 20px; background: #007bff; border: none; color: #fff;
      border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 15px;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>Connection Lost</h1>
  <p>Unable to connect to the Telemedicine portal.</p>
  <p>Please verify your network connection.</p>
  <button id="retry">🔄 Try Reconnecting</button>
  <small>Retrying automatically every 10 seconds…</small>
  <script>
    document.getElementById('retry').addEventListener('click', () => window.s10Desktop.retry());
  </script>
</body>
</html>
