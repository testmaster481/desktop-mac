<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Choose what to share</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px; background: #f5f7fa; color: #1f2937; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 8px 0 16px; color: #6b7280; font-size: 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      border: 1px solid #dfe3e8; background: #fff; border-radius: 8px;
      padding: 8px 16px; cursor: pointer; font-size: 14px;
    }
    .tab.active { background: #007bff; color: #fff; border-color: #007bff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .source {
      background: #fff; border: 2px solid #dfe3e8; border-radius: 12px; overflow: hidden;
      cursor: pointer; transition: .15s ease;
    }
    .source:hover { border-color: #007bff; box-shadow: 0 5px 20px rgba(0,0,0,.08); }
    .thumb { width: 100%; height: 135px; object-fit: contain; background: #e5e7eb; display: block; }
    .name {
      display: flex; align-items: center; gap: 8px; padding: 12px;
      font-size: 14px; font-weight: 600; word-break: break-word;
    }
    .name img { width: 18px; height: 18px; flex: none; }
    .empty { color: #6b7280; padding: 30px 0; }
    .buttons { display: flex; justify-content: flex-end; margin-top: 22px; }
    .cancel { border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <h1>Choose what to share</h1>
  <p>Select a screen or application window to share with your consultation.</p>
  <div class="tabs">
    <button class="tab active" data-kind="screen">Entire screen</button>
    <button class="tab" data-kind="window">Window</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="buttons"><button class="cancel" id="cancel">Cancel</button></div>

  <script>
    let all = [];
    let kind = 'screen';
    const grid = document.getElementById('grid');

    function render() {
      grid.textContent = '';
      const list = all.filter((s) => (kind === 'screen') === s.isScreen);
      if (!list.length) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'Nothing available in this category.';
        grid.appendChild(e);
        return;
      }
      for (const s of list) {
        const item = document.createElement('div');
        item.className = 'source';
        item.tabIndex = 0;

        const img = document.createElement('img');
        img.className = 'thumb';
        if (s.thumbnail) img.src = s.thumbnail;

        const name = document.createElement('div');
        name.className = 'name';
        if (s.icon) {
          const ic = document.createElement('img');
          ic.src = s.icon;
          name.appendChild(ic);
        }
        const label = document.createElement('span');
        label.textContent = s.name;
        name.appendChild(label);

        item.append(img, name);
        const pick = () => window.pickerAPI.select(s.id);
        item.addEventListener('click', pick);
        item.addEventListener('keydown', (e) => { if (e.key === 'Enter') pick(); });
        grid.appendChild(item);
      }
    }

    document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
      kind = t.dataset.kind;
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
      render();
    }));
    document.getElementById('cancel').addEventListener('click', () => window.pickerAPI.cancel());
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.pickerAPI.cancel(); });

    window.pickerAPI.onSources((sources) => {
      all = sources;
      if (!all.some((s) => s.isScreen) && all.length) {
        kind = 'window';
        document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.dataset.kind === 'window'));
      }
      render();
    });
  </script>
</body>
</html>
