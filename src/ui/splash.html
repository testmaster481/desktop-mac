<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #fff; height: 100vh; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      border: 4px solid rgba(0,123,255,.1); border-left-color: #007bff;
      width: 46px; height: 46px; border-radius: 50%; animation: spin 1s linear infinite;
    }
    .brand { margin-top: 20px; font-size: 18px; font-weight: 600; color: #212529; letter-spacing: .5px; }
    .status { margin-top: 8px; font-size: 13px; color: #6c757d; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="brand">S10 Telemedicine</div>
  <div class="status">Securing connection to live portal...</div>
</body>
</html>
