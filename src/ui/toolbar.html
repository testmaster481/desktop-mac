<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 12px;
      box-sizing: border-box;
      border-bottom: 1px solid #e0e0e0;
      user-select: none;
    }
    .btn {
      background: #fff;
      border: 1px solid #ced4da;
      padding: 6px 12px;
      margin-right: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease;
    }
    .btn:hover { background: #e2e6ea; }
    .btn:active { background: #dae0e5; }
  </style>
</head>
<body>
  <button class="btn" id="back">← Back</button>
  <button class="btn" id="forward">→ Forward</button>
  <button class="btn" id="refresh">↻ Refresh</button>
  <button class="btn" id="home">🏠 Home</button>
  <script>
    for (const id of ['back', 'forward', 'refresh', 'home']) {
      document.getElementById(id).addEventListener('click', () => window.navAPI[id]());
    }
  </script>
</body>
</html>
